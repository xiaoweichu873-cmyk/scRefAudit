[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screfaudit"
version = "0.1.0"
description = "Reference-composition sensitivity analysis for single-cell optimal transport annotation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]
license = {text = "MIT"}
authors = [{name = "Xiaowei Chu", email = "xiaoweichu873@gmail.com"}]
keywords = ["single-cell", "optimal-transport", "sensitivity-analysis", "bioinformatics"]

[tool.setuptools.packages.find]
where = ["inst/python"]
include = ["screfaudit*", "sopc_ot*"]
