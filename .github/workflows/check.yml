name: Package checks
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests/python -v
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - run: python examples/quickstart.py
  r-interface:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: python -m pip install numpy scipy
      - run: Rscript -e 'install.packages("reticulate", repos="https://cloud.r-project.org")'
      - run: R CMD build .
      - run: R CMD check --no-manual scRefAudit_0.1.0.tar.gz
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
          SCREFAUDIT_RUN_R_TESTS: 'true'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
